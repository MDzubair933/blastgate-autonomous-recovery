<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#d8a955"/></marker></defs><rect width="1600" height="1000" fill="#0b0f14"/><text x="60" y="64" font-family="Arial,sans-serif" font-size="22" fill="#d8a955" font-weight="600">BLASTGATE</text><text x="60" y="119" font-family="Arial,sans-serif" font-size="40" fill="#f5f4f1" font-weight="400">The agent proposes. The broker decides.</text><text x="60" y="161" font-family="Arial,sans-serif" font-size="18" fill="#b5b8bd" font-weight="400">Source architecture · one bounded recovery action · not a live execution trace</text><rect x="60" y="220" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="80" y="254" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">ECS Fargate worker</text><text x="80" y="285" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Application progress + health</text><text x="80" y="309" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">DynamoDB heartbeat evidence</text><rect x="450" y="220" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="470" y="254" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">Watchdog + CloudWatch</text><text x="470" y="285" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Fresh telemetry → stall metric</text><text x="470" y="309" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Alarm transition</text><rect x="840" y="220" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="860" y="254" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">Incident + EventBridge</text><text x="860" y="285" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Ingestion deduplicates incident</text><text x="860" y="309" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Incident-open event → target</text><rect x="1230" y="220" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="1250" y="254" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">Dispatcher Lambda</text><text x="1250" y="285" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Atomic incident dispatch lock</text><text x="1250" y="309" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Invoke Managed Harness</text><path d="M360,294 L440,294" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><path d="M750,294 L830,294" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><path d="M1140,294 L1220,294" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><path d="M1380,368 L1380,450" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><rect x="1230" y="460" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="1250" y="494" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">AgentCore Harness</text><text x="1250" y="525" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Amazon Nova Micro + Guardrails</text><text x="1250" y="549" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Only diagnostics / proposal tools</text><text x="1250" y="573" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">No direct mutation authority</text><rect x="840" y="460" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="860" y="494" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">AgentCore Gateway</text><text x="860" y="525" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Cedar principal + tool scope</text><text x="860" y="549" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Proposal action restriction</text><text x="860" y="573" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Native service enforcement</text><rect x="450" y="460" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="470" y="494" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">Independent broker</text><text x="470" y="525" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">R1–R8 live state validation</text><text x="470" y="549" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Reserve cooldown + audit</text><text x="470" y="573" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Authorize before mutation</text><rect x="60" y="460" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="80" y="494" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">ECS service recovery</text><text x="80" y="525" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Scoped StopTask on one worker</text><text x="80" y="549" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">ECS launches replacement</text><text x="80" y="573" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Verify new healthy task</text><path d="M1230,534 L1150,534" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><path d="M840,534 L760,534" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,534 L370,534" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><path d="M990,608 L990,685" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><path d="M600,608 L600,685" fill="none" stroke="#d8a955" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="695" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="860" y="729" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">Diagnostics Lambda</text><text x="860" y="760" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Read-only incident / telemetry</text><text x="860" y="784" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Bounded logs are untrusted</text><rect x="450" y="695" width="300" height="148" rx="10" fill="#11161d" stroke="#42464d"/><text x="470" y="729" font-family="Arial,sans-serif" font-size="21" fill="#f5f4f1" font-weight="600">DynamoDB state + audit</text><text x="470" y="760" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">600-second cluster cooldown</text><text x="470" y="784" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Idempotency + structured audit</text><text x="60" y="893" font-family="Arial,sans-serif" font-size="14" fill="#d8a955" font-weight="600">ENFORCEMENT</text><text x="60" y="928" font-family="Arial,sans-serif" font-size="23" fill="#f5f4f1" font-weight="400">Guardrails → tool allowlist → Cedar → broker invariants → scoped IAM permissions</text><text x="60" y="969" font-family="Arial,sans-serif" font-size="16" fill="#b5b8bd" font-weight="400">Architectural order; compact recovery evidence does not retain every intermediate timestamp or tool trace.</text></svg>